<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <title>astronomy</title>
  </head>
  <body>
    <main class="layout">
      <header class="topbar">
        <div class="topbar-left">
          <span class="pulse-logo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            astronomy
          </span>
        </div>
        <div class="topbar-right">
          <div class="weather" id="weather" title="Weather">
            <span class="weather-icon" id="weatherIcon">…</span>
            <span class="weather-temp" id="weatherTemp">--°</span>
          </div>
          <button class="icon-btn" id="todoToggle" title="Todos">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          </button>
          <button class="icon-btn" id="notesToggle" title="Notes">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </button>
          <button class="icon-btn" id="settingsToggle" title="Edit shortcuts">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
          </button>
        </div>
      </header>

      <section class="center">
        <div class="greeting" id="greeting">Good evening</div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">—</div>

        <form class="search" id="searchForm">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Search the web or type a URL…" autocomplete="off" spellcheck="false">
        </form>

        <div class="speed-dial" id="speedDial"></div>
      </section>

      <section class="apod" id="app"></section>
    </main>

    <aside class="panel panel-todos" id="todoPanel">
      <div class="panel-header">
        <h2>Todos</h2>
        <button class="panel-close" data-close="todoPanel">×</button>
      </div>
      <form id="todoForm" class="panel-form">
        <input type="text" id="todoInput" placeholder="Add a task…" autocomplete="off">
        <button type="submit" class="panel-add">+</button>
      </form>
      <ul class="todo-list" id="todoList"></ul>
      <div class="panel-footer">
        <span id="todoCount">0 tasks</span>
        <button id="todoClear" class="link-btn">clear done</button>
      </div> 
    </aside>

    <aside class="panel panel-notes" id="notesPanel">
      <div class="panel-header">
        <h2>Notes</h2>
        <button class="panel-close" data-close="notesPanel">×</button>
      </div>
      <textarea id="notesArea" placeholder="Write something…" spellcheck="false"></textarea>
      <div class="panel-footer">
        <span id="notesSaved">saved</span>
      </div>
    </aside>

    <aside class="panel panel-settings" id="settingsPanel">
      <div class="panel-header">
        <h2>Shortcuts</h2>
        <button class="panel-close" data-close="settingsPanel">×</button>
      </div>
      <div id="shortcutEditor"></div>
      <button id="addShortcut" class="panel-add wide">+ add shortcut</button>
      <div class="panel-footer">
        <span>Stored in your browser</span>
      </div>
    </aside>

    <div class="focus" id="focus">
      <div class="focus-ring">
        <svg viewBox="0 0 120 120" class="focus-svg">
          <circle class="focus-track" cx="60" cy="60" r="52"></circle>
          <circle class="focus-progress" id="focusProgress" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="focus-center">
          <span class="focus-time" id="focusTime">25:00</span>
          <span class="focus-label" id="focusLabel">start</span>
        </div>
      </div>
      <button class="focus-btn" id="focusBtn">Start</button>
      <div class="focus-modes" id="focusModes">
        <button data-min="25" class="focus-mode active">25</button>
        <button data-min="45" class="focus-mode">45</button>
        <button data-min="60" class="focus-mode">60</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
